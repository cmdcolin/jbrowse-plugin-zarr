name: Publish

# Fires on the v* tag `pnpm version patch` pushes from its postversion hook.
# Publishes with npm trusted publishing (OIDC), so there is no NPM_TOKEN secret
# and `npm whoami` failing locally means nothing.
#
# One-time setup on npmjs.com, without which the first tag fails: package
# settings > Trusted Publishers > add repository cmdcolin/jbrowse-plugin-zarr
# and workflow publish.yml. Trusted publishing configures an *existing* package,
# so the very first release of a new name still has to go out another way.
#
# `cache: pnpm` below errors out when no lockfile is present, before it ever
# reaches the publish. pnpm-lock.yaml is committed and has to stay that way — a
# routine "Updates" commit dropped it from jbrowse-plugin-hubs and every tag
# after that failed in ~10s until it came back.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish --access public --provenance --no-git-checks
